name: Agent Cron Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: dead-mans-switch-agent-cron
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run agent for one cycle window
        run: timeout 8m npm run start
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          PROGRAM_ID: ${{ secrets.PROGRAM_ID }}
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          LOG_LEVEL: info
          POLL_INTERVAL_MS: 240000
          ACTIVITY_CHECK_INTERVAL_MS: 240000
          ACTIVITY_REMINDER_COOLDOWN_SECONDS: 21600
          ADVANCE_STATE_RETRY_ATTEMPTS: 3
          ADVANCE_STATE_RETRY_BASE_DELAY_MS: 1500
          NOTIFICATION_RETRY_ATTEMPTS: 3
          NOTIFICATION_RETRY_BASE_DELAY_MS: 1000
          BOT_RATE_LIMIT_WINDOW_MS: 30000
          BOT_RATE_LIMIT_MAX_COMMANDS: 6
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
