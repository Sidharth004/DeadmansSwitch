name: Koyeb Keepalive Ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: koyeb-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Curl /health
        env:
          KOYEB_HEALTH_URL: ${{ secrets.KOYEB_HEALTH_URL }}
        run: |
          if [ -z "$KOYEB_HEALTH_URL" ]; then
            echo "Missing secret: KOYEB_HEALTH_URL"
            exit 1
          fi
          echo "Pinging $KOYEB_HEALTH_URL"
          curl -fsS --max-time 20 "$KOYEB_HEALTH_URL" | head -c 200

